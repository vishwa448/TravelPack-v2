<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Pack | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <div class="flex items-center justify-center mb-6">
            <img src="assets/img/logo.png" alt="Travel Logo" class="w-16 h-16">
            <h1 class="text-2xl font-bold text-blue-600 ml-3">Travel Pack</h1>
        </div>
        <h2 class="text-xl font-semibold text-gray-700 text-center mb-4">Login to Your Account</h2>

        <form action="#" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-gray-600 font-medium">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <div>
                <label for="password" class="block text-gray-600 font-medium">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full mt-1 px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                Sign In
            </button>
        </form>

    </div>

</body>
</html>
