<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Packages | Travel Pack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

<div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg min-h-screen p-6">
        <div class="flex items-center mb-8">
            <img src="https://cdn-icons-png.flaticon.com/512/1082/1082600.png" alt="Travel Logo" class="w-10 h-10">
            <h1 class="text-xl font-bold text-blue-600 ml-2">Travel Pack</h1>
        </div>
        <nav class="space-y-3">
            <a href="#" class="block py-2 px-4 rounded-lg hover:bg-blue-50 text-gray-700">Dashboard</a>
            <a href="#" class="block py-2 px-4 rounded-lg bg-blue-100 text-blue-700 font-semibold">Manage Packages</a>
            <a href="#" class="block py-2 px-4 rounded-lg hover:bg-blue-50 text-gray-700">Bookings</a>
            <a href="#" class="block py-2 px-4 rounded-lg hover:bg-blue-50 text-gray-700">Customers</a>
            <a href="#" class="block py-2 px-4 rounded-lg hover:bg-blue-50 text-gray-700">Reports</a>
            <a href="#" class="block py-2 px-4 rounded-lg text-red-600 hover:bg-red-100">Logout</a>
        </nav>
    </aside>

    <!-- Manage Packages Content -->
    <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-blue-700">Manage Packages</h2>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg">
                + Add Package
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-blue-100 text-blue-700 uppercase text-sm">
                        <th class="px-4 py-3">#</th>
                        <th class="px-4 py-3">Package Name</th>
                        <th class="px-4 py-3">Type</th>
                        <th class="px-4 py-3">Price</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b hover:bg-blue-50">
                        <td class="px-4 py-3">1</td>
                        <td class="px-4 py-3 font-semibold">Colombo City Tour</td>
                        <td class="px-4 py-3">Tour</td>
                        <td class="px-4 py-3">$50</td>
                        <td class="px-4 py-3">
                            <span class="inline-block bg-green-100 text-green-600 px-2 py-1 rounded text-xs">Active</span>
                        </td>
                        <td class="px-4 py-3 text-center space-x-2">
                            <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm">Edit</button>
                            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm">Delete</button>
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-blue-50">
                        <td class="px-4 py-3">2</td>
                        <td class="px-4 py-3 font-semibold">Whale Watching</td>
                        <td class="px-4 py-3">Activity</td>
                        <td class="px-4 py-3">$65</td>
                        <td class="px-4 py-3">
                            <span class="inline-block bg-green-100 text-green-600 px-2 py-1 rounded text-xs">Active</span>
                        </td>
                        <td class="px-4 py-3 text-center space-x-2">
                            <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm">Edit</button>
                            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm">Delete</button>
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-blue-50">
                        <td class="px-4 py-3">3</td>
                        <td class="px-4 py-3 font-semibold">7 Days Cultural Tour</td>
                        <td class="px-4 py-3">Tour</td>
                        <td class="px-4 py-3">$480</td>
                        <td class="px-4 py-3">
                            <span class="inline-block bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs">Inactive</span>
                        </td>
                        <td class="px-4 py-3 text-center space-x-2">
                            <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded-lg text-sm">Edit</button>
                            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
