<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logged Out | Travel Pack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md text-center">
        <div class="flex justify-center mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png" alt="Logout Icon" class="w-20 h-20">
        </div>
        <h1 class="text-2xl font-bold text-blue-600 mb-2">You've Logged Out</h1>
        <p class="text-gray-500 mb-6">Thank you for using Travel Pack. You’ve successfully logged out of your account.</p>

        <a href="login.html"
           class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg">
            Sign In Again
        </a>

        <p class="text-sm text-gray-400 mt-6">Redirecting to login in <span id="countdown">5</span> seconds...</p>
    </div>

    <script>
        let counter = 5;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            counter--;
            countdownElement.textContent = counter;
            if (counter <= 0) {
                clearInterval(timer);
                window.location.href = "login.html"; // Redirect after countdown
            }
        }, 1000);
    </script>

</body>
</html>
