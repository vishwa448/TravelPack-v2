<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Pack | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

    <!-- Sidebar -->
    <div class="flex">
        <aside class="w-64 bg-white shadow-lg min-h-screen p-6">
            <div class="flex items-center mb-8">
                <img src="assets/img/logo.png" alt="Travel Logo" class="w-12 h-12">
                <h1 class="text-xl font-bold text-blue-600 ml-2">Travel Pack</h1>
            </div>
            <nav class="space-y-3">
                <a href="dashboard.html" class="block py-2 px-4 rounded-lg bg-blue-100 text-blue-700 font-semibold">Dashboard</a>
                <a href="manage-packages.html" class="block py-2 px-4 rounded-lg text-gray-700 hover:bg-blue-50">Manage Packages</a>
                <a href="#" class="block py-2 px-4 rounded-lg text-gray-700 hover:bg-blue-50">Bookings</a>
                <a href="#" class="block py-2 px-4 rounded-lg text-gray-700 hover:bg-blue-50">Customers</a>
                <a href="#" class="block py-2 px-4 rounded-lg text-gray-700 hover:bg-blue-50">Reports</a>
                <a href="user-management.html" class="block py-2 px-4 rounded-lg text-gray-700 hover:bg-blue-50">User Management</a>
                <a href="admin-logout.html" class="block py-2 px-4 rounded-lg text-red-600 hover:bg-red-100">Logout</a>
            </nav>
        </aside>

        <!-- Main Dashboard -->
        <main class="flex-1 p-8">
            <h2 class="text-2xl font-bold text-blue-700 mb-6">Dashboard Overview</h2>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-blue-600 text-white rounded-xl p-5 shadow-lg">
                    <p class="text-sm uppercase">Total Bookings</p>
                    <h2 class="text-3xl font-bold">152</h2>
                </div>
                <div class="bg-blue-500 text-white rounded-xl p-5 shadow-lg">
                    <p class="text-sm uppercase">Revenue</p>
                    <h2 class="text-3xl font-bold">$12,400</h2>
                </div>
                <div class="bg-blue-400 text-white rounded-xl p-5 shadow-lg">
                    <p class="text-sm uppercase">Active Packages</p>
                    <h2 class="text-3xl font-bold">24</h2>
                </div>
                <div class="bg-blue-300 text-white rounded-xl p-5 shadow-lg">
                    <p class="text-sm uppercase">New Users</p>
                    <h2 class="text-3xl font-bold">45</h2>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-semibold text-blue-600 mb-4">Recent Bookings</h3>
                <p class="text-gray-500">Here you can display a table or list of recent bookings.</p>
            </div>
        </main>
    </div>

</body>
</html>
